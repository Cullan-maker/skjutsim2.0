<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Skjutbiograf Pro - PBR Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;900&display=swap');

        :root {
            --bg-light: #e0e5ec;
            --bg-dark: #9ba4b5;
            --neon-blue: #00e5ff;
            --neon-green: #00e676;
            --neon-red: #ff1744;
        }

        /* Ljus inomhus-miljö med vinjettering */
        body { 
            margin: 0; background: radial-gradient(circle at 50% 40%, var(--bg-light) 0%, var(--bg-dark) 100%);
            overflow: hidden; display: flex; height: 100vh; width: 100vw; 
            font-family: 'Rajdhani', sans-serif; color: #333;
        }
        
        /* Sidebar med Neumorphism (Mjuk PBR-stil) */
        #sidebar { 
            width: 360px; background: rgba(224, 229, 236, 0.8); backdrop-filter: blur(20px);
            padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; 
            border-right: 1px solid rgba(255,255,255,0.5); z-index: 100;
            box-shadow: 10px 0 30px rgba(0,0,0,0.1);
        }
        
        h2 { margin: 0; color: #2c3e50; font-size: 32px; font-weight: 900; letter-spacing: 1px; text-shadow: 1px 1px 2px white; }
        h3 { margin: 5px 0; font-size: 14px; color: #555; text-transform: uppercase; font-weight: 700; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 5px;}
        
        .setting-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 12px; color: #666; font-weight: 700; text-transform: uppercase;}
        input { 
            width: 100%; padding: 12px; background: #e0e5ec; border: none; color: #333; 
            border-radius: 8px; font-size: 16px; font-weight: bold; box-sizing: border-box;
            box-shadow: inset 5px 5px 10px #c8d0da, inset -5px -5px 10px #f8fbfd; outline: none;
        }
        
        button { 
            background: #e0e5ec; color: #2196F3; border: none; padding: 15px; font-family: 'Rajdhani'; 
            font-size: 18px; font-weight: 900; border-radius: 8px; cursor: pointer; transition: 0.2s; 
            box-shadow: 5px 5px 10px #c8d0da, -5px -5px 10px #f8fbfd; margin-top: 10px;
        }
        button:hover { color: #0b7dda; box-shadow: 2px 2px 5px #c8d0da, -2px -2px 5px #f8fbfd; transform: scale(0.99); }
        button.niva-btn { color: #ff9800; }
        button.stop-btn { color: var(--neon-red); margin-top: auto; }

        #main-view { flex-grow: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #big-info { position: absolute; top: 5%; width: 100%; text-align: center; z-index: 50; pointer-events: none; }
        #instruction { font-size: 38px; color: rgba(0,0,0,0.5); text-transform: uppercase; font-weight: 700; text-shadow: 1px 1px 2px white; }
        #command { font-size: 100px; font-weight: 900; margin: -15px 0; color: #2c3e50; text-shadow: 2px 2px 5px rgba(0,0,0,0.2), -1px -1px 2px white; }
        #progress-info { font-size: 32px; color: #2196F3; font-weight: 700; }
        
        .cmd-fire { color: var(--neon-red) !important; text-shadow: 0 0 20px rgba(255,23,68,0.5) !important; }

        #hit-feedback { 
            position: absolute; top: 35%; width: 100%; text-align: center; 
            font-size: 160px; font-weight: 900; opacity: 0; z-index: 60; pointer-events: none;
            transform: scale(0.5); transition: opacity 0.1s, transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .feedback-pop { opacity: 1 !important; transform: scale(1) !important; }

        /* --- KALIBRERINGSMARKÖR --- */
        #calibration-mark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; z-index: 10; opacity: 1; transition: opacity 0.3s;
        }
        #calibration-mark::before, #calibration-mark::after {
            content: ''; position: absolute; background: rgba(0, 229, 255, 0.8);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }
        #calibration-mark::before { width: 100%; height: 2px; top: 19px; left: 0; }
        #calibration-mark::after { width: 2px; height: 100%; top: 0; left: 19px; }
        .hidden-mark { opacity: 0 !important; }

        /* --- PBR MÅLTAVLA --- */
        #target-wrapper { position: relative; transition: transform 0.4s ease; z-index: 20; }
        #target-container { perspective: 1200px; display: flex; align-items: center; justify-content: center; }
        
        #target {
            width: 100%; height: 100%; border-radius: 50%;
            /* Fysiskt Papper/Papp-utseende */
            background: radial-gradient(circle at 30% 30%, #3a3a3a 0%, #111 80%);
            border: 5px solid #222;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform: rotateY(90deg);
            /* Djup och ambient occlusion */
            box-shadow: 
                inset 0 0 50px rgba(0,0,0,1), 
                20px 20px 60px rgba(0,0,0,0.4), 
                -5px -5px 20px rgba(255,255,255,0.5);
            position: relative; overflow: hidden;
        }
        
        /* Ringen */
        #inner-circle { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            border: 3px solid rgba(255,255,255,0.6); border-radius: 50%; 
            box-sizing: border-box; box-shadow: 0 0 15px rgba(255,255,255,0.2), inset 0 0 15px rgba(255,255,255,0.2);
        }
        
        .visible { transform: rotateY(0deg) !important; }
        
        /* Fysiska skotthål */
        .bullet-hole { 
            position: absolute; width: 15px; height: 15px; 
            background: #050505; border-radius: 50%; transform: translate(-50%, -50%); z-index: 30;
            box-shadow: inset 0 5px 10px rgba(0,0,0,1), 0 1px 1px rgba(255,255,255,0.3);
        }

        /* Partikel Canvas */
        #fxCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none; }

    </style>
</head>
<body>

    <div id="sidebar">
        <h2>SKJUTBIOGRAF</h2>
        
        <h3>System</h3>
        <div class="setting-group"><label>Nätverks-ID</label><input type="text" id="myId" value="min_unika_simulator_123"></div>
        <div class="setting-group"><label>Avstånd till skärm (Meter)</label><input type="number" id="physDist" value="2.5" step="0.1"></div>

        <h3>Polisens Prov</h3>
        <button class="niva-btn" onclick="runNivaKontroll()">STARTA NIVÅKONTROLL</button>
        
        <h3>Fri Träning</h3>
        <div style="display: flex; gap: 10px;">
            <div class="setting-group" style="flex: 1;"><label>Målavstånd</label><input type="number" id="virtDist" value="10"></div>
            <div class="setting-group" style="flex: 1;"><label>Tid (sek)</label><input type="number" id="showTime" value="3.0" step="0.1"></div>
        </div>
        <button onclick="startQuickDraw()">STARTA DRAGTRÄNING</button>
        <button class="stop-btn" onclick="stopEverything()">AVBRYT</button>
    </div>

    <div id="main-view">
        <canvas id="fxCanvas"></canvas>
        
        <div id="calibration-mark"></div>

        <div id="big-info">
            <div id="instruction">Redo att ansluta</div>
            <div id="command">-</div>
            <div id="progress-info"></div>
        </div>

        <div id="hit-feedback">TRÄFF</div>

        <div id="target-wrapper">
            <div id="target-container">
                <div id="target"><div id="inner-circle"></div></div>
            </div>
        </div>
    </div>

    <script>
        let client, isRunning = false, cycleTimeout, precisionTimer;
        const PIXELS_PER_CM = 38; 

        const target = document.getElementById('target');
        const targetContainer = document.getElementById('target-container');
        const innerCircle = document.getElementById('inner-circle');
        const cmd = document.getElementById('command');
        const inst = document.getElementById('instruction');
        const progressInfo = document.getElementById('progress-info');
        const hitFeedback = document.getElementById('hit-feedback');
        const calMark = document.getElementById('calibration-mark');
        
        // FX Canvas
        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        // Ljudsyntes (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if(type === 'hit') {
                // Pling (Stål/Elektronisk träff)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else {
                // Dovt Bupp (Bom)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
                    life: 1.0, color: color, size: Math.random() * 4 + 2
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.2; // Gravity
                p.life -= 0.03;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                if (p.life <= 0) particles.splice(i, 1);
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        function connect() {
            const myId = document.getElementById('myId').value;
            client = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), "screen_" + Math.random().toString(16).slice(2,8));
            client.onMessageArrived = (msg) => { if (JSON.parse(msg.payloadString).action === "BANG") handleShot(JSON.parse(msg.payloadString)); };
            client.connect({ useSSL: true, onSuccess: () => { 
                client.subscribe(myId); 
                inst.innerText = "Sikta på krysset och kalibrera";
            }});
        }
        connect();

        function setScale(virtualDist) {
            const physDist = parseFloat(document.getElementById('physDist').value);
            const circleSizePixels = (physDist * 1.0) * PIXELS_PER_CM;
            innerCircle.style.width = circleSizePixels + "px"; innerCircle.style.height = circleSizePixels + "px";
            
            // Hela tavlan är exakt 3x större än inre cirkeln
            const targetContainerSize = circleSizePixels * 3; 
            targetContainer.style.width = targetContainerSize + "px";
            targetContainer.style.height = targetContainerSize + "px";
        }

        function handleShot(data) {
            if (!target.classList.contains('visible')) return;

            const rect = target.getBoundingClientRect();
            const centerX = rect.width / 2; const centerY = rect.height / 2;
            const hitX = centerX + (data.x * 12); const hitY = centerY + (data.y * 12);
            
            const hole = document.createElement('div');
            hole.className = 'bullet-hole'; hole.style.left = hitX + 'px'; hole.style.top = hitY + 'px';
            target.appendChild(hole);

            const dist = Math.sqrt(Math.pow(hitX - centerX, 2) + Math.pow(hitY - centerY, 2));
            const circleRadius = parseFloat(innerCircle.style.width) / 2;

            // Kinetisk effekt position på stora canvasen
            const globalX = rect.left + hitX;
            const globalY = rect.top + hitY;

            if (dist <= circleRadius) {
                showBigFeedback("TRÄFF", "var(--neon-green)");
                playSound('hit'); createParticles(globalX, globalY, '#00e676');
            } else if (dist <= rect.width/2) {
                showBigFeedback("UTANFÖR", "#ff9800");
                playSound('hit'); createParticles(globalX, globalY, '#ff9800');
            } else {
                showBigFeedback("BOM", "var(--neon-red)");
                playSound('miss'); createParticles(globalX, globalY, '#555');
            }
        }

        function showBigFeedback(text, color) {
            hitFeedback.innerText = text; hitFeedback.style.color = color;
            hitFeedback.classList.add('feedback-pop');
            setTimeout(() => { hitFeedback.classList.remove('feedback-pop'); }, 500);
        }

        const wait = (ms) => new Promise(r => { if(isRunning) cycleTimeout = setTimeout(r, ms); });

        async function runNivaKontroll() {
            stopEverything(); isRunning = true;
            for (let o = 1; o <= 3; o++) {
                if(!isRunning) break;
                await runSubMoment(`Låg färdigställning (Omgång ${o})`, 10, 3000, 5);
                await runSubMoment(`Drag från hölster (Omgång ${o})`, 10, 4000, 5);
                await runPrecision(15, 60000, 3);
            }
            if(isRunning) { inst.innerText = "Nivåkontroll Klar"; cmd.innerText = "GODKÄND"; stopEverything(); }
        }

        async function runSubMoment(name, dist, time, reps) {
            setScale(dist); inst.innerText = name;
            for(let i=0; i<reps; i++) {
                if(!isRunning) return;
                progressInfo.innerText = `Visning ${i+1} av ${reps}`;
                cmd.innerText = "STANDBY"; cmd.style.color = "var(--neon-orange)";
                calMark.classList.remove('hidden-mark'); // Visa laser
                
                await wait(4000);
                if(!isRunning) return;
                
                calMark.classList.add('hidden-mark'); // Dölj laser
                target.classList.add('visible');
                cmd.innerText = "ELD!"; cmd.className = "cmd-fire";
                await wait(time);
                target.classList.remove('visible');
                cmd.className = "";
                await wait(2000);
            }
        }

        async function runPrecision(dist, time, shots) {
            setScale(dist); inst.innerText = "Precision";
            cmd.innerText = `Skjut ${shots} skott`; cmd.style.color = "var(--neon-orange)";
            calMark.classList.remove('hidden-mark');
            await wait(4000);
            if(!isRunning) return;
            
            calMark.classList.add('hidden-mark');
            target.classList.add('visible');
            cmd.innerText = "ELD!"; cmd.className = "cmd-fire";
            let sec = time / 1000;
            precisionTimer = setInterval(() => {
                sec--; progressInfo.innerText = `${sec}s kvar`;
                if(sec <= 0) clearInterval(precisionTimer);
            }, 1000);
            await wait(time);
            target.classList.remove('visible');
            clearInterval(precisionTimer);
            progressInfo.innerText = "TID UTE"; cmd.className = "";
            await wait(3000);
        }

        async function startQuickDraw() {
            stopEverything(); isRunning = true;
            const d = document.getElementById('virtDist').value;
            const t = document.getElementById('showTime').value * 1000;
            setScale(d);
            let v = 1;
            while(isRunning) {
                inst.innerText = "Fri Träning"; progressInfo.innerText = `Visning ${v}`;
                cmd.innerText = "STANDBY"; cmd.style.color = "var(--neon-orange)";
                calMark.classList.remove('hidden-mark');
                await wait(Math.random()*3000+2000);
                if(!isRunning) break;
                
                calMark.classList.add('hidden-mark');
                target.classList.add('visible');
                cmd.innerText = "ELD!"; cmd.className = "cmd-fire";
                await wait(t);
                target.classList.remove('visible');
                cmd.className = "";
                await wait(2000); v++;
            }
        }

        function stopEverything() {
            clearTimeout(cycleTimeout); clearInterval(precisionTimer);
            isRunning = false; target.classList.remove('visible');
            cmd.innerText = "-"; cmd.className = ""; inst.innerText = "System Standby"; progressInfo.innerText = "";
            calMark.classList.remove('hidden-mark');
            document.querySelectorAll('.bullet-hole').forEach(e => e.remove());
        }
    </script>
</body>
</html>

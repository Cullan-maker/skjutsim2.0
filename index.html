<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Skjutbiograf - Måltavla</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { margin: 0; background: #222; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; }
        
        #info-panel { position: absolute; top: 20px; left: 20px; font-size: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; }
        #status { font-weight: bold; color: #ff9800; margin-bottom: 10px; }
        #log { font-family: monospace; font-size: 16px; color: #aaa; white-space: pre-line; }

        #target-container { perspective: 1000px; position: relative; width: 400px; height: 400px; }
        
        /* Ren CSS-Måltavla (Går inte att blockera) */
        #target {
            width: 100%; height: 100%; border-radius: 50%;
            background: repeating-radial-gradient(
                circle,
                #fff 0px, #fff 20px,
                #000 20px, #000 60px,
                #fff 60px, #fff 100px,
                #000 100px, #000 140px,
                #fff 140px, #fff 180px,
                #222 180px
            );
            border: 5px solid #fff;
            transition: transform 0.3s ease-in-out;
            transform: rotateY(90deg); /* Startar bortvänd */
            position: absolute;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        .visible { transform: rotateY(0deg) !important; }

        /* Skotthål */
        .bullet-hole {
            position: absolute;
            width: 12px; height: 12px;
            background: #111;
            border: 2px solid #555;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 0 5px black, 0 0 2px rgba(255,255,255,0.5);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="info-panel">
        <div id="status">Väntar på koppling...</div>
        <div id="log">Logg redo...</div>
    </div>

    <div id="target-container" id="screen-center">
        <div id="target"></div>
    </div>

    <script>
        const MY_ID = "min_unika_simulator_123"; 

        const target = document.getElementById('target');
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');
        const container = document.getElementById('target-container');

        const client = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), "screen_" + Math.random().toString(16).substr(2, 8));
        
        client.onConnectionLost = () => { statusEl.innerText = "Anslutning bruten!"; statusEl.style.color = "red"; };
        
        client.onMessageArrived = (msg) => {
            const data = JSON.parse(msg.payloadString);
            if (data.action === "BANG") {
                registerHit(data.x, data.y);
            }
        };

        client.connect({ 
            useSSL: true,
            onSuccess: () => {
                client.subscribe(MY_ID);
                statusEl.innerText = "Kopplad! Starta från telefonen.";
                statusEl.style.color = "#4CAF50";
                startTargetCycle();
            }
        });

        function startTargetCycle() {
            setInterval(() => {
                target.classList.add('visible');
                statusEl.innerText = "MÅL FRAMME! (3 sek)";
                statusEl.style.color = "#f44336";
                
                setTimeout(() => {
                    target.classList.remove('visible');
                    statusEl.innerText = "VÄNTAR...";
                    statusEl.style.color = "#ff9800";
                }, 3000);
            }, 7000);
        }

        function registerHit(gyroX, gyroY) {
            if (!target.classList.contains('visible')) {
                logEl.innerHTML = "BOM! (Tavlan var bortvänd)\n" + logEl.innerHTML;
                return;
            }

            // Mappar gyrots vinkel till skärmens pixlar (Center är 200, 200 i containern)
            // Känslighet: 1 grad = ca 15 pixlar på skärmen
            const hitX = 200 + (gyroX * 15); 
            const hitY = 200 + (gyroY * 15);

            // Rita ut skotthålet
            const hole = document.createElement('div');
            hole.className = 'bullet-hole';
            hole.style.left = hitX + 'px';
            hole.style.top = hitY + 'px';
            container.appendChild(hole);

            // Räkna ut avstånd från mitten (centrum är 200, 200)
            const dist = Math.sqrt(Math.pow(hitX - 200, 2) + Math.pow(hitY - 200, 2));
            
            let score = 0;
            if (dist < 20) score = 10;
            else if (dist < 60) score = 9;
            else if (dist < 100) score = 8;
            else if (dist < 140) score = 7;
            else if (dist < 180) score = 6;
            else score = 0; // Utanför tavlan

            if (score > 0) {
                logEl.innerHTML = `<span style="color:#00ff00">TRÄFF! Poäng: ${score}</span>\n` + logEl.innerHTML;
            } else {
                logEl.innerHTML = `<span style="color:#ff3333">MISS (Utanför tavlan)</span>\n` + logEl.innerHTML;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Skjutbiograf Pro - Nivåkontroll</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { margin: 0; background: #222; overflow: hidden; display: flex; height: 100vh; width: 100vw; color: white; font-family: sans-serif; }
        
        /* Kontrollpanelen */
        #sidebar { width: 300px; background: #111; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; border-right: 2px solid #333; z-index: 10; overflow-y: auto; }
        h2 { margin: 0 0 10px 0; color: #4CAF50; font-size: 20px; }
        label { font-size: 14px; color: #ccc; }
        input[type="number"] { width: 100%; padding: 8px; margin-top: 5px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; box-sizing: border-box; }
        button { background: #2196F3; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1976D2; }
        button.action { background: #ff9800; }
        button.action:hover { background: #e68a00; }

        /* Huvudarenan */
        #arena { flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center; }
        
        /* Måltavlan (Responsiv) */
        #target-wrapper { position: absolute; transition: transform 0.5s ease-in-out; }
        #target-container { perspective: 1000px; position: relative; width: 400px; height: 400px; }
        #target {
            width: 100%; height: 100%; border-radius: 50%;
            background: repeating-radial-gradient( circle, #fff 0px, #fff 20px, #000 20px, #000 60px, #fff 60px, #fff 100px, #000 100px, #000 140px, #fff 140px, #fff 180px, #222 180px );
            border: 5px solid #fff; transition: transform 0.3s ease-in-out; transform: rotateY(90deg); box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .visible { transform: rotateY(0deg) !important; }
        .bullet-hole { position: absolute; width: 10px; height: 10px; background: #111; border: 1px solid #555; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: inset 0 0 3px black; z-index: 10; }

        /* Status & Logg */
        #status-bar { position: absolute; top: 20px; width: 100%; text-align: center; font-size: 32px; font-weight: bold; color: #ff9800; text-transform: uppercase; z-index: 5; text-shadow: 2px 2px 5px black; }
        #log { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; width: 250px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 14px; }

        /* Analys-Grafen (Nere till vänster) */
        #graph-panel { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); border: 2px solid #444; border-radius: 8px; padding: 10px; }
        #graph-title { font-size: 12px; color: #aaa; margin-bottom: 5px; text-align: center; }
        canvas { background: #111; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Inställningar</h2>
        <div><label>Fysiskt avstånd (m):</label><input type="number" id="physDist" value="2.5" step="0.5"></div>
        <hr style="border-color:#333; width:100%;">
        
        <h2>Manuell Träning</h2>
        <div><label>Målavstånd (m):</label><input type="number" id="virtDist" value="10"></div>
        <div><label>Visningstid (sek):</label><input type="number" id="showTime" value="3"></div>
        <div><label>Väntetid (sek):</label><input type="number" id="hideTime" value="4"></div>
        <button onclick="startManual()">Kör Manuell</button>
        <button onclick="stopAll()" style="background:#f44336;">Avbryt</button>
        
        <hr style="border-color:#333; width:100%;">
        <h2>Polisens Nivåkontroll</h2>
        <button class="action" onclick="startNivaKontroll()">Starta Nivåkontroll</button>
        <div style="font-size: 12px; color:#aaa; margin-top:5px;">
            Mom 1: 15m (6 skott, 15 sek)<br>
            Mom 2: 10m (2 skott, 3 sek)<br>
            Mom 3: 7m (2 skott, 2 sek)
        </div>
    </div>

    <div id="arena">
        <div id="status-bar">Väntar på anslutning...</div>
        <div id="target-wrapper">
            <div id="target-container"><div id="target"></div></div>
        </div>
        
        <div id="graph-panel">
            <div id="graph-title">SKJUTBANA (Sista 0.5 sek)</div>
            <canvas id="graphCanvas" width="200" height="200"></canvas>
        </div>
        
        <div id="log">Logg redo...</div>
    </div>

    <script>
        const MY_ID = "min_unika_simulator_123"; 
        const target = document.getElementById('target');
        const wrapper = document.getElementById('target-wrapper');
        const container = document.getElementById('target-container');
        const statusEl = document.getElementById('status-bar');
        const logEl = document.getElementById('log');
        const ctx = document.getElementById('graphCanvas').getContext('2d');

        let cycleInterval, cycleTimeout;
        let isDrillActive = false;

        // MQTT Koppling
        const client = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), "screen_" + Math.random().toString(16).substr(2, 8));
        client.onConnectionLost = () => { statusEl.innerText = "Anslutning bruten!"; statusEl.style.color = "red"; };
        client.onMessageArrived = (msg) => {
            const data = JSON.parse(msg.payloadString);
            if (data.action === "BANG") {
                registerHit(data.x, data.y);
                drawGraph(data.trace, data.x, data.y);
            }
        };

        client.connect({ useSSL: true, onSuccess: () => {
            client.subscribe(MY_ID);
            statusEl.innerText = "Redo! Starta en övning.";
            statusEl.style.color = "#4CAF50";
        }});

        // Skalningsfunktion
        function setTargetDistance(targetMeters) {
            const phys = parseFloat(document.getElementById('physDist').value) || 2.5;
            const scale = phys / targetMeters; 
            // Om du står 2.5m bort och målet ska vara 10m, blir tavlan 25% av originalstorleken.
            wrapper.style.transform = `scale(${scale})`;
            logEl.innerHTML = `> Avstånd satt till ${targetMeters}m\n` + logEl.innerHTML;
        }

        // Avbryt pågående övning
        function stopAll() {
            clearInterval(cycleInterval); clearTimeout(cycleTimeout);
            target.classList.remove('visible');
            statusEl.innerText = "Avbruten";
            statusEl.style.color = "#aaa";
            isDrillActive = false;
        }

        // Manuell Övning
        function startManual() {
            stopAll();
            const virt = parseFloat(document.getElementById('virtDist').value) || 10;
            const showTime = (parseFloat(document.getElementById('showTime').value) || 3) * 1000;
            const hideTime = (parseFloat(document.getElementById('showTime').value) || 4) * 1000; // Tiden den är borta
            
            setTargetDistance(virt);
            isDrillActive = true;
            
            const loop = () => {
                target.classList.add('visible');
                statusEl.innerText = "ELD!";
                statusEl.style.color = "#f44336";
                
                cycleTimeout = setTimeout(() => {
                    target.classList.remove('visible');
                    statusEl.innerText = "Vänta...";
                    statusEl.style.color = "#ff9800";
                }, showTime);
            };
            
            loop(); // Kör direkt
            cycleInterval = setInterval(loop, showTime + hideTime);
        }

        // Nivåkontrollen (Asynkron sekvens)
        async function startNivaKontroll() {
            stopAll();
            isDrillActive = true;
            statusEl.innerText = "NIVÅKONTROLL STARTAR...";
            
            const wait = (ms) => new Promise(res => { cycleTimeout = setTimeout(res, ms); });
            const runStage = async (dist, time, msg) => {
                if(!isDrillActive) return;
                setTargetDistance(dist);
                statusEl.innerText = `LADDA: ${msg}`;
                statusEl.style.color = "#2196F3";
                await wait(4000); // 4 sekunders förberedelse
                
                if(!isDrillActive) return;
                target.classList.add('visible');
                statusEl.innerText = "ELD!";
                statusEl.style.color = "#f44336";
                
                await wait(time);
                
                target.classList.remove('visible');
                statusEl.innerText = "TID UTE";
                statusEl.style.color = "#aaa";
                await wait(3000); // Vila mellan moment
            };

            await wait(2000);
            await runStage(15, 15000, "15m, 6 skott (15 sek)");
            await runStage(10, 3000, "10m, 2 skott (3 sek)");
            await runStage(7, 2000, "7m, 2 skott (2 sek)");
            
            if(isDrillActive) {
                statusEl.innerText = "NIVÅKONTROLL KLAR";
                statusEl.style.color = "#4CAF50";
                isDrillActive = false;
            }
        }

        function registerHit(gyroX, gyroY) {
            if (!target.classList.contains('visible')) {
                logEl.innerHTML = "<span style='color:#ff3333'>BOM! (Bortvänd)</span>\n" + logEl.innerHTML;
                return;
            }
            // Känslighet på gyro -> skärmpixlar (200 är centrum)
            const hitX = 200 + (gyroX * 15); 
            const hitY = 200 + (gyroY * 15);
            
            const hole = document.createElement('div');
            hole.className = 'bullet-hole';
            hole.style.left = hitX + 'px';
            hole.style.top = hitY + 'px';
            container.appendChild(hole);

            const dist = Math.sqrt(Math.pow(hitX - 200, 2) + Math.pow(hitY - 200, 2));
            if (dist < 180) {
                logEl.innerHTML = `<span style='color:#00ff00'>TRÄFF</span>\n` + logEl.innerHTML;
            } else {
                logEl.innerHTML = `<span style='color:#ff9800'>MISS</span>\n` + logEl.innerHTML;
            }
        }

        function drawGraph(trace, finalX, finalY) {
            if(!trace || trace.length === 0) return;
            ctx.clearRect(0, 0, 200, 200);
            
            // Bakgrundskors (Mitten)
            ctx.strokeStyle = "#333"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(100, 0); ctx.lineTo(100, 200); ctx.moveTo(0, 100); ctx.lineTo(200, 100); ctx.stroke();

            // Rita spåret (blå linje)
            ctx.strokeStyle = "#2196F3"; ctx.lineWidth = 2; ctx.beginPath();
            trace.forEach((p, index) => {
                let px = 100 + (p.x * 5); // Skala för grafen
                let py = 100 + (p.y * 5);
                if (index === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            });
            ctx.stroke();

            // Rita slutgiltiga skottet (Röd prick)
            let endX = 100 + (finalX * 5);
            let endY = 100 + (finalY * 5);
            ctx.fillStyle = "red";
            ctx.beginPath(); ctx.arc(endX, endY, 5, 0, Math.PI * 2); ctx.fill();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Skjutbiograf Pro - Polisens Nivåkontroll</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; display: flex; height: 100vh; width: 100vw; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Kontrollpanelen till vänster */
        #sidebar { width: 320px; background: #111; padding: 25px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; border-right: 3px solid #444; z-index: 100; overflow-y: auto; }
        h2 { margin: 0; color: #4CAF50; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .setting-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 13px; color: #888; font-weight: bold; }
        input { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 5px; font-size: 16px; }
        
        button { background: #2196F3; color: white; border: none; padding: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:hover { background: #1976D2; transform: translateY(-2px); }
        button.niva-btn { background: #ff9800; border: 2px solid #fb8c00; font-size: 18px; margin-top: 10px; }
        button.niva-btn:hover { background: #f57c00; }
        button.stop-btn { background: #f44336; margin-top: auto; }

        /* Huvudvyn */
        #main-view { flex-grow: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #2c2c2c 0%, #1a1a1a 100%); }
        
        /* JÄTTESTOR STATUSINFORMATION */
        #big-info { position: absolute; top: 10%; width: 100%; text-align: center; z-index: 50; pointer-events: none; }
        #instruction { font-size: 40px; color: #aaa; text-transform: uppercase; margin-bottom: 10px; }
        #command { font-size: 120px; font-weight: 900; text-shadow: 0 5px 15px rgba(0,0,0,0.8); transition: 0.1s; }
        .cmd-wait { color: #ffeb3b; }
        .cmd-fire { color: #f44336; transform: scale(1.1); }
        
        /* Träff-feedback (Stor!) */
        #hit-feedback { position: absolute; top: 45%; font-size: 150px; font-weight: 900; opacity: 0; pointer-events: none; z-index: 60; text-transform: uppercase; transition: 0.2s; }

        /* Måltavlan */
        #target-wrapper { position: relative; transition: transform 0.4s ease; }
        #target-container { perspective: 1200px; width: 450px; height: 450px; position: relative; }
        #target {
            width: 100%; height: 100%; border-radius: 50%;
            /* Tavlan: Svart yttre, Vita ringar, Svart inre cirkel */
            background: #000;
            border: 4px solid #fff;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotateY(90deg); /* Startar bortvänd */
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            position: relative;
        }
        /* Den stora cirkeln (träffområdet) */
        #inner-circle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50%; height: 50%; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
        }
        .visible { transform: rotateY(0deg) !important; }
        .bullet-hole { position: absolute; width: 12px; height: 12px; background: #111; border: 2px solid #555; border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; }

        /* Analys och Logg */
        #analysis-box { position: absolute; bottom: 30px; left: 30px; background: rgba(0,0,0,0.85); border: 2px solid #444; border-radius: 10px; padding: 15px; }
        #log { position: absolute; bottom: 30px; right: 30px; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 10px; width: 300px; height: 200px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 13px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>System</h2>
        <div class="setting-group">
            <label>Din ID (Samma på mobilen):</label>
            <input type="text" id="myId" value="min_unika_simulator_123">
        </div>
        <div class="setting-group">
            <label>Avstånd till skärm (m):</label>
            <input type="number" id="physDist" value="2.5" step="0.1">
        </div>

        <h2 style="margin-top:20px;">Övningar</h2>
        <button class="niva-btn" onclick="runNivaKontroll()">STARTA NIVÅKONTROLL</button>
        
        <div id="stats" style="margin-top: 10px; font-size: 14px; line-height: 1.6; color: #4CAF50;">
            Krav: Max 1 träff utanför cirkeln per moment. (Måste vara i tavlan).
        </div>

        <button class="stop-btn" onclick="stopEverything()">AVBRYT ALLT</button>
    </div>

    <div id="main-view">
        <div id="big-info">
            <div id="instruction">Väntar på start...</div>
            <div id="command" class="cmd-wait">REDO</div>
        </div>

        <div id="hit-feedback">TRÄFF</div>

        <div id="target-wrapper">
            <div id="target-container">
                <div id="target"><div id="inner-circle"></div></div>
            </div>
        </div>

        <div id="analysis-box">
            <div style="font-size: 12px; margin-bottom: 5px; color: #888;">REKYL/RÖRELSEANALYS</div>
            <canvas id="graphCanvas" width="220" height="220"></canvas>
        </div>

        <div id="log">Logg aktiverad...</div>
    </div>

    <script>
        // --- GRUNDLÄGGANDE LOGIK ---
        let client, isRunning = false;
        let shotsInCircle = 0, shotsInTarget = 0, totalShotsInMoment = 0;
        let currentMomentName = "";
        let cycleTimeout;

        const target = document.getElementById('target');
        const wrapper = document.getElementById('target-wrapper');
        const cmd = document.getElementById('command');
        const inst = document.getElementById('instruction');
        const hitFeedback = document.getElementById('hit-feedback');
        const log = document.getElementById('log');
        const gCtx = document.getElementById('graphCanvas').getContext('2d');

        function connect() {
            const myId = document.getElementById('myId').value;
            client = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), "screen_" + Math.random().toString(16).slice(2,8));
            client.onMessageArrived = (msg) => {
                const data = JSON.parse(msg.payloadString);
                if (data.action === "BANG") handleShot(data);
            };
            client.connect({ useSSL: true, onSuccess: () => { 
                client.subscribe(myId);
                addLog("Systemet kopplat via " + myId);
            }});
        }
        connect();

        function addLog(msg) {
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            log.innerHTML = `<div>[${time}] ${msg}</div>` + log.innerHTML;
        }

        function setScale(virtualMeters) {
            const phys = parseFloat(document.getElementById('physDist').value);
            const scale = phys / virtualMeters;
            wrapper.style.transform = `scale(${scale})`;
        }

        function showBigFeedback(text, color) {
            hitFeedback.innerText = text;
            hitFeedback.style.color = color;
            hitFeedback.style.opacity = "1";
            setTimeout(() => { hitFeedback.style.opacity = "0"; }, 600);
        }

        function handleShot(data) {
            if (!target.classList.contains('visible')) {
                addLog("SKOTT UTANFÖR TID (BOM)");
                return;
            }

            const hitX = 225 + (data.x * 15);
            const hitY = 225 + (data.y * 15);
            const dist = Math.sqrt(Math.pow(hitX - 225, 2) + Math.pow(hitY - 225, 2));

            const hole = document.createElement('div');
            hole.className = 'bullet-hole';
            hole.style.left = hitX + 'px'; hole.style.top = hitY + 'px';
            document.getElementById('target').appendChild(hole);

            totalShotsInMoment++;
            
            // Logik för godkänd cirkel (Inom 50% av tavlan)
            if (dist < 112) {
                shotsInCircle++;
                showBigFeedback("TRÄFF", "#4CAF50");
                addLog(`Moment ${currentMomentName}: Träff i cirkeln!`);
            } else if (dist < 225) {
                shotsInTarget++;
                showBigFeedback("UTANFÖR", "#ff9800");
                addLog(`Moment ${currentMomentName}: Träff utanför cirkeln.`);
            } else {
                showBigFeedback("BOM", "#f44336");
                addLog(`Moment ${currentMomentName}: BOM (Utanför tavlan)`);
            }

            drawGraph(data.trace, data.x, data.y);
        }

        function drawGraph(trace, fx, fy) {
            gCtx.clearRect(0,0,220,220);
            gCtx.strokeStyle = "#333"; gCtx.beginPath(); gCtx.moveTo(110,0); gCtx.lineTo(110,220); gCtx.moveTo(0,110); gCtx.lineTo(220,110); gCtx.stroke();
            if(!trace) return;
            gCtx.strokeStyle = "#2196F3"; gCtx.lineWidth = 2; gCtx.beginPath();
            trace.forEach((p, i) => {
                let x = 110 + (p.x * 5); let y = 110 + (p.y * 5);
                if(i===0) gCtx.moveTo(x,y); else gCtx.lineTo(x,y);
            });
            gCtx.stroke();
            gCtx.fillStyle = "red"; gCtx.beginPath(); gCtx.arc(110+(fx*5), 110+(fy*5), 4, 0, 7); gCtx.fill();
        }

        // --- NIVÅKONTROLLEN ---
        const wait = (ms) => new Promise(r => cycleTimeout = setTimeout(r, ms));

        async function runNivaKontroll() {
            if(isRunning) return;
            isRunning = true;
            addLog("--- STARTAR NIVÅKONTROLL ---");

            for (let omgang = 1; omgang <= 3; omgang++) {
                addLog(`OMGÅNG ${omgang} av 3`);
                
                // MOMENT 1: Låg färdigställning (10m, 3s, x5)
                await runMoment("Låg färdigställning", 10, 3000, 5, "Håll vapnet i låg färdigställning");
                
                // MOMENT 2: Drag från hölster (10m, 4s, x5)
                await runMoment("Drag från hölster", 10, 4000, 5, "Vapnet i hölstret");
                
                // MOMENT 3: Precision (15m, 60s, 3 skott)
                await runPrecision(15, 60000, 3);
            }

            inst.innerText = "Nivåkontroll slutförd";
            cmd.innerText = "KLAR";
            cmd.className = "cmd-wait";
            isRunning = false;
        }

        async function runMoment(name, dist, time, repeats, instructionText) {
            currentMomentName = name;
            shotsInCircle = 0; shotsInTarget = 0; totalShotsInMoment = 0;
            setScale(dist);
            inst.innerText = name + ` (${dist}m)`;
            
            for (let i = 1; i <= repeats; i++) {
                cmd.innerText = instructionText;
                cmd.style.fontSize = "30px";
                cmd.className = "cmd-wait";
                await wait(4000); // Tid att förbereda

                cmd.innerText = "ELD!";
                cmd.style.fontSize = "120px";
                cmd.className = "cmd-fire";
                target.classList.add('visible');
                
                await wait(time);
                
                target.classList.remove('visible');
                cmd.innerText = "AVBRYT";
                cmd.className = "cmd-wait";
                await wait(2000);
            }
            
            // Kontrollera godkänd
            const isOk = (shotsInTarget <= 1) && (shotsInCircle + shotsInTarget >= repeats);
            addLog(`RESULTAT ${name}: ${isOk ? "GODKÄND" : "UNDERKÄND"} (${shotsInCircle} i cirkel)`);
        }

        async function runPrecision(dist, time, shots) {
            currentMomentName = "Precision";
            shotsInCircle = 0; shotsInTarget = 0; totalShotsInMoment = 0;
            setScale(dist);
            inst.innerText = `Precision (${dist}m)`;
            cmd.innerText = `Skjut ${shots} skott`;
            cmd.style.fontSize = "40px";
            cmd.className = "cmd-wait";
            await wait(3000);

            cmd.innerText = "ELD!";
            cmd.style.fontSize = "120px";
            cmd.className = "cmd-fire";
            target.classList.add('visible');
            
            await wait(time); // Vänta 60 sek
            
            target.classList.remove('visible');
            cmd.innerText = "TID UTE";
            cmd.className = "cmd-wait";
            const isOk = (shotsInTarget <= 1) && (shotsInCircle + shotsInTarget >= shots);
            addLog(`RESULTAT Precision: ${isOk ? "GODKÄND" : "UNDERKÄND"}`);
            await wait(3000);
        }

        function stopEverything() {
            clearTimeout(cycleTimeout);
            target.classList.remove('visible');
            isRunning = false;
            inst.innerText = "Avbruten";
            cmd.innerText = "STOPP";
            addLog("Simulatorn stoppad.");
        }
    </script>
</body>
</html>

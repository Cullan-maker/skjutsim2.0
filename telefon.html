<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vapen-Sensor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #222; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        button { background: #4CAF50; color: white; border: none; padding: 20px; font-size: 20px; border-radius: 10px; width: 100%; margin-bottom: 20px; }
        #mic-indicator { width: 100%; height: 20px; background: #444; margin: 10px 0; border-radius: 10px; overflow: hidden; }
        #mic-level { height: 100%; width: 0%; background: lime; transition: width 0.1s; }
    </style>
</head>
<body>
    <h2>Vapen-Sensor</h2>
    <button id="startBtn">1. Aktivera Sensorer</button>
    <div id="status">Status: Ej redo</div>
    <div id="mic-indicator"><div id="mic-level"></div></div>
    <p>Känslighet: <input type="range" id="threshold" min="0" max="255" value="150"></p>

    <script>
        const MY_ID = "min_unika_simulator_123"; // MÅSTE VARA SAMMA SOM PÅ DATORN
        let client, audioContext, analyser, dataArray;
        const startBtn = document.getElementById('startBtn');
        const micLevel = document.getElementById('mic-level');
        const thresholdInput = document.getElementById('threshold');

        async function init() {
            // 1. MQTT Koppling
            client = new Paho.MQTT.Client("broker.hivemq.com", Number(8000), "phone_" + Math.random());
            client.connect({ onSuccess: () => { document.getElementById('status').innerText = "Kopplad till datorn!"; }});

            // 2. Ljud-analys
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);

            // 3. Sensor-tillstånd (iOS)
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                await DeviceOrientationEvent.requestPermission();
            }

            detectSound();
        }

        function detectSound() {
            analyser.getByteFrequencyData(dataArray);
            let maxVol = Math.max(...dataArray);
            micLevel.style.width = (maxVol / 2.55) + "%";

            if (maxVol > thresholdInput.value) {
                sendShot();
            }
            requestAnimationFrame(detectSound);
        }

        function sendShot() {
            const message = new Paho.MQTT.Message("BANG");
            message.destinationName = MY_ID;
            client.send(message);
            document.body.style.background = "red";
            setTimeout(() => { document.body.style.background = "#222"; }, 100);
        }

        startBtn.addEventListener('click', init);
    </script>
</body>
</html>

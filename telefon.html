<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Glock AR - Struket Korn</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; text-align: center; height: 100vh; width: 100vw; }
        
        #camera-stream { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        
        .panel { background: rgba(0,0,0,0.85); padding: 15px; pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
        button { background: #4CAF50; color: white; border: none; padding: 15px 25px; font-size: 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #calBtn { background: #2196F3; display: none; }
        
        /* --- VERKLIGHETSTROGET SIKTE (Struket korn) --- */
        #sight-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; width: 200px; height: 120px; }
        
        /* Bakre siktet (Bredare, lägre skåra) */
        .rear-sight { position: absolute; bottom: 0; left: 0; width: 200px; height: 50px; background: #111; border-top: 3px solid #666; clip-path: polygon(0 0, 75px 0, 75px 100%, 125px 100%, 125px 0, 200px 0, 200px 100%, 0 100%); }
        
        /* Främre siktet (Kornet). Fjädrar runt beroende på tröghet */
        .front-sight { 
            position: absolute; bottom: 0px; left: 88px; /* Centrerad (200/2 - 24/2) */
            width: 24px; height: 65px; background: #222; border-top: 2px solid #555;
            transition: transform 0.05s linear; 
        }
        .front-dot { 
            position: absolute; top: 5px; left: 6px; width: 12px; height: 12px; 
            background: white; border-radius: 50%; box-shadow: 0 0 5px rgba(255,255,255,0.5); transition: background 0.2s;
        }

        #status { font-size: 16px; margin: 0; color: #ff9800; font-weight: bold; }
    </style>
</head>
<body>

    <video id="camera-stream" autoplay playsinline muted></video>

    <div id="sight-container" style="display: none;">
        <div class="front-sight" id="front-sight"><div class="front-dot" id="front-dot"></div></div>
        <div class="rear-sight"></div>
    </div>

    <div id="ui-layer">
        <div class="panel" id="top-panel">
            <h3 style="margin:0;">Glock AR Pro</h3>
            <div id="status">Klicka Start för helskärm & AR</div>
            <button id="startBtn">STARTA</button>
            <button id="calBtn">KALIBRERA (Sikta mot center)</button>
        </div>
        
        <input type="range" id="threshold" min="0" max="255" value="150" style="position: absolute; bottom: 20px; left: 10%; width: 80%; pointer-events: auto; opacity: 0.5;">
    </div>

    <script>
        const MY_ID = "min_unika_simulator_123"; 

        let client, audioContext, analyser, dataArray;
        let isReadyToShoot = true;
        
        let startAlpha = null, startBeta = null, startGamma = null;
        let currentX = 0, currentY = 0;
        let traceHistory = []; // Sparar positioner för grafen

        // Fysik för struket korn
        let lastX = 0, lastY = 0;
        let sightOffsetX = 0, sightOffsetY = 0;
        let isSightAligned = false;

        const startBtn = document.getElementById('startBtn');
        const calBtn = document.getElementById('calBtn');
        const statusEl = document.getElementById('status');
        const video = document.getElementById('camera-stream');
        const frontSight = document.getElementById('front-sight');
        const frontDot = document.getElementById('front-dot');

        async function initSystem() {
            try {
                // Tvinga Helskärm
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: "environment" } });
                video.srcObject = stream;

                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioCtx();
                if(audioContext.state === 'suspended') audioContext.resume();
                
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm !== 'granted') throw new Error("Gyroskop nekat.");
                }

                client = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), "phone_" + Math.random().toString(16).substr(2, 8));
                client.connect({ useSSL: true, onSuccess: () => { 
                    statusEl.innerText = "Kalibrera mot skärmen.";
                    statusEl.style.color = "lime";
                    startBtn.style.display = "none";
                    calBtn.style.display = "inline-block";
                    document.getElementById('sight-container').style.display = "block";
                    
                    window.addEventListener('deviceorientation', handleOrientation);
                    detectSound(); 
                    physicsLoop();
                }});
            } catch (error) { alert("Fel: " + error.message); }
        }

        calBtn.addEventListener('click', () => {
            startAlpha = null; traceHistory = [];
            statusEl.innerText = "REDO! Struket korn krävs.";
            statusEl.style.color = "white";
        });

        function handleOrientation(event) {
            if (startAlpha === null) { 
                startAlpha = event.alpha; startBeta = event.beta; startGamma = event.gamma; 
            }
            let deltaX = event.gamma - startGamma;
            let deltaY = event.alpha - startAlpha;
            if (deltaY > 180) deltaY -= 360; 
            if (deltaY < -180) deltaY += 360;

            currentX = deltaX; 
            currentY = deltaY;
        }

        function physicsLoop() {
            // Spara data till grafen (max 30 senaste positionerna = ca 0.5 sek rörelse)
            traceHistory.push({ x: currentX, y: currentY });
            if (traceHistory.length > 30) traceHistory.shift();

            // Räkna hastighet
            let velocityX = currentX - lastX;
            let velocityY = currentY - lastY;

            // Känslighet för siktet. Y är höjdled, X är sidled.
            let targetOffsetX = -(velocityX * 15);
            let targetOffsetY = -(velocityY * 15);

            sightOffsetX += (targetOffsetX - sightOffsetX) * 0.2; // Mjuk återgång
            sightOffsetY += (targetOffsetY - sightOffsetY) * 0.2;

            lastX = currentX; lastY = currentY;

            // Flytta grafiskt (Kornet).
            frontSight.style.transform = `translate(${sightOffsetX}px, ${sightOffsetY}px)`;

            // Kontrollera om det är ett "Struket Korn" (Väldigt strikt: Max 5 pixlar fel)
            // Det betyder att kornet varken får vara för högt, lågt eller snett i skåran.
            isSightAligned = Math.abs(sightOffsetX) < 5 && Math.abs(sightOffsetY) < 5;
            
            frontDot.style.background = isSightAligned ? "white" : "#f44336";
            frontDot.style.boxShadow = isSightAligned ? "0 0 5px white" : "none";

            requestAnimationFrame(physicsLoop);
        }

        function detectSound() {
            analyser.getByteFrequencyData(dataArray);
            if (Math.max(...dataArray) > document.getElementById('threshold').value && isReadyToShoot) {
                fireShot();
            }
            requestAnimationFrame(detectSound);
        }

        function fireShot() {
            isReadyToShoot = false;
            let finalX = currentX, finalY = currentY;

            if (!isSightAligned) {
                // Straff för dåligt sikte
                finalX += (Math.random() > 0.5 ? 20 : -20); 
                finalY -= 20; 
            }

            // Skicka ALLT till datorn (Skott + Gyro-grafen)
            const payload = JSON.stringify({ action: "BANG", x: finalX, y: finalY, trace: traceHistory });
            const message = new Paho.MQTT.Message(payload);
            message.destinationName = MY_ID;
            client.send(message);
            
            document.getElementById('ui-layer').style.background = isSightAligned ? "rgba(0,255,0,0.5)" : "rgba(255,0,0,0.5)";
            setTimeout(() => { document.getElementById('ui-layer').style.background = "transparent"; isReadyToShoot = true; }, 400);
        }

        startBtn.addEventListener('click', initSystem);
    </script>
</body>
</html>
</html>

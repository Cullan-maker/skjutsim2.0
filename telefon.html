<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Glock AR Sensor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

        body { margin: 0; background: #000; color: white; font-family: 'Rajdhani', sans-serif; overflow: hidden; text-align: center; height: 100vh; width: 100vw; }
        
        #camera-stream { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; transition: background 0.05s; }
        
        .panel { 
            background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(5px);
            padding: 15px 30px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 10px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3); box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        
        button { 
            background: rgba(0, 229, 255, 0.1); color: #00e5ff; border: 1px solid #00e5ff; 
            padding: 12px 25px; font-size: 18px; border-radius: 4px; font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 1px;
            cursor: pointer; transition: all 0.2s; 
        }
        button:active { background: #00e5ff; color: #000; }
        
        #calBtn { display: none; background: rgba(0, 230, 118, 0.1); color: #00e676; border-color: #00e676; }
        #calBtn:active { background: #00e676; color: #000; }
        
        /* --- METALLISKT SIKTE --- */
        #sight-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; width: 220px; height: 120px; }
        
        /* Bakre skåran (Mörk metall) */
        .rear-sight { 
            position: absolute; bottom: 0; left: 0; width: 220px; height: 50px; 
            background: linear-gradient(to bottom, #333, #111); 
            border-top: 2px solid #555; 
            clip-path: polygon(0 0, 85px 0, 85px 100%, 135px 100%, 135px 0, 220px 0, 220px 100%, 0 100%); 
        }
        
        /* Främre kornet */
        .front-sight { 
            position: absolute; bottom: 0px; left: 98px; /* Mitten (220/2 - 24/2) */
            width: 24px; height: 65px; 
            background: linear-gradient(to right, #222, #111, #222); 
            border-top: 2px solid #666;
            transition: transform 0.05s linear; 
        }
        
        .front-dot { 
            position: absolute; top: 8px; left: 6px; width: 12px; height: 12px; 
            background: #777; border-radius: 50%; transition: background 0.2s, box-shadow 0.2s;
        }

        /* Perfekt sikte = Vitt och lysande */
        .dot-aligned { background: #fff !important; box-shadow: 0 0 8px rgba(255,255,255,0.9); }

        #status { font-size: 18px; margin: 0; color: #00e5ff; letter-spacing: 1px; }
        
        /* Tactical Slider */
        input[type=range] { -webkit-appearance: none; width: 60%; background: transparent; pointer-events: auto; opacity: 0.5; position: absolute; bottom: 20px; left: 20%; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 10px; background: #00e5ff; cursor: pointer; border-radius: 2px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 2px; cursor: pointer; background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <video id="camera-stream" autoplay playsinline muted></video>

    <div id="sight-container" style="display: none;">
        <div class="front-sight" id="front-sight"><div class="front-dot" id="front-dot"></div></div>
        <div class="rear-sight"></div>
    </div>

    <div id="ui-layer">
        <div class="panel" id="top-panel">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                <h3 style="margin:0; color:#fff; letter-spacing: 2px;">VAPEN<span style="color:#00e5ff">SENSOR</span></h3>
                <div id="status">VÄNTAR PÅ START</div>
            </div>
            <button id="startBtn">AKTIVERA KAMERA</button>
            <button id="calBtn">KALIBRERA SIKTE</button>
        </div>
        
        <input type="range" id="threshold" min="0" max="255" value="150">
    </div>

    <script>
        const MY_ID = "min_unika_simulator_123"; 

        let client, audioContext, analyser, dataArray;
        let isReadyToShoot = true;
        let startAlpha = null, startBeta = null, startGamma = null;
        let currentX = 0, currentY = 0;
        let traceHistory = []; 
        let lastX = 0, lastY = 0;
        let sightOffsetX = 0, sightOffsetY = 0;

        const startBtn = document.getElementById('startBtn');
        const calBtn = document.getElementById('calBtn');
        const statusEl = document.getElementById('status');
        const video = document.getElementById('camera-stream');
        const frontSight = document.getElementById('front-sight');
        const frontDot = document.getElementById('front-dot');

        async function initSystem() {
            startBtn.innerText = "LADDAR...";
            
            try {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(e => console.log("Fullscreen off"));
                }
            } catch(e) {}

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: true, 
                    video: { facingMode: { ideal: "environment" } } 
                });
                video.srcObject = stream;

                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioCtx();
                if(audioContext.state === 'suspended') audioContext.resume();
                
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm !== 'granted') throw new Error("Gyroskop nekat");
                }

                client = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), "phone_" + Math.random().toString(16).substr(2, 8));
                client.connect({ useSSL: true, onSuccess: () => { 
                    statusEl.innerText = "RIKTA MOT SKÄRM";
                    statusEl.style.color = "#00e676";
                    startBtn.style.display = "none";
                    calBtn.style.display = "block";
                    document.getElementById('sight-container').style.display = "block";
                    
                    window.addEventListener('deviceorientation', handleOrientation);
                    detectSound(); 
                    physicsLoop();
                }});
            } catch (error) { 
                alert("Fel: " + error.message); 
                startBtn.innerText = "FÖRSÖK IGEN";
            }
        }

        calBtn.addEventListener('click', () => {
            startAlpha = null; traceHistory = [];
            statusEl.innerText = "SENSOR AKTIV";
            statusEl.style.color = "#fff";
        });

        function handleOrientation(event) {
            if (startAlpha === null) { 
                startAlpha = event.alpha; startBeta = event.beta; startGamma = event.gamma; 
            }
            let deltaX = event.gamma - startGamma;
            let deltaY = event.alpha - startAlpha;
            if (deltaY > 180) deltaY -= 360; 
            if (deltaY < -180) deltaY += 360;

            currentX = deltaX; 
            currentY = deltaY;
        }

        function physicsLoop() {
            traceHistory.push({ x: currentX, y: currentY });
            if (traceHistory.length > 30) traceHistory.shift();

            let velocityX = currentX - lastX;
            let velocityY = currentY - lastY;

            let targetOffsetX = -(velocityX * 10);
            let targetOffsetY = -(velocityY * 10);

            sightOffsetX += (targetOffsetX - sightOffsetX) * 0.2; 
            sightOffsetY += (targetOffsetY - sightOffsetY) * 0.2;

            lastX = currentX; lastY = currentY;

            frontSight.style.transform = `translate(${sightOffsetX}px, ${sightOffsetY}px)`;

            // Visuell hjälp: Pricken lyser vitt vid struket korn
            let isAligned = Math.abs(sightOffsetX) < 6 && Math.abs(sightOffsetY) < 6;
            if(isAligned) {
                frontDot.classList.add('dot-aligned');
            } else {
                frontDot.classList.remove('dot-aligned');
            }

            requestAnimationFrame(physicsLoop);
        }

        function detectSound() {
            analyser.getByteFrequencyData(dataArray);
            if (Math.max(...dataArray) > document.getElementById('threshold').value && isReadyToShoot) {
                fireShot();
            }
            requestAnimationFrame(detectSound);
        }

        function fireShot() {
            isReadyToShoot = false;
            
            const payload = JSON.stringify({ action: "BANG", x: currentX, y: currentY, trace: traceHistory });
            const message = new Paho.MQTT.Message(payload);
            message.destinationName = MY_ID;
            client.send(message);
            
            // Realistisk mynningsflamma (Vit snabb blixt)
            document.getElementById('ui-layer').style.background = "rgba(255,255,255,0.6)";
            setTimeout(() => { document.getElementById('ui-layer').style.background = "transparent"; isReadyToShoot = true; }, 80);
        }

        startBtn.addEventListener('click', initSystem);
    </script>
</body>
</html>

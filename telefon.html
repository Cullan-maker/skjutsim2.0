<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Glock AR Sensor - Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

        body { margin: 0; background: #000; color: white; font-family: 'Rajdhani', sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        
        #camera-stream { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; background: #050505; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; transition: background 0.05s; }
        
        /* Modern Neumorphic / Frosted UI */
        .panel { 
            background: rgba(15, 15, 18, 0.7); backdrop-filter: blur(10px);
            padding: 15px 25px; pointer-events: auto; display: flex; flex-direction: row; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        button { 
            background: linear-gradient(145deg, #00d4ff, #0096ff); color: #000; border: none; 
            padding: 12px 25px; font-size: 16px; border-radius: 6px; font-family: 'Rajdhani'; font-weight: 700; letter-spacing: 1px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0, 150, 255, 0.4); transition: transform 0.1s; 
        }
        button:active { transform: scale(0.95); }
        
        #calBtn { display: none; background: linear-gradient(145deg, #00e676, #00c853); box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4); }
        
        /* --- PBR METALLISKT SIKTE --- */
        #sight-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; width: 220px; height: 100px; }
        
        /* Bakre skåran med djup/bevel */
        .rear-sight { 
            position: absolute; bottom: 0; left: 0; width: 220px; height: 60px; 
            background: linear-gradient(180deg, #444 0%, #1a1a1a 10%, #0a0a0a 100%); 
            border-top: 1px solid #777; 
            clip-path: polygon(0 0, 85px 0, 85px 100%, 135px 100%, 135px 0, 220px 0, 220px 100%, 0 100%); 
            filter: drop-shadow(0 10px 10px rgba(0,0,0,1));
        }
        
        /* Främre kornet med reflektion */
        .front-sight { 
            position: absolute; bottom: 10px; left: 98px; width: 24px; height: 50px; 
            background: linear-gradient(90deg, #111 0%, #333 20%, #444 50%, #222 80%, #0a0a0a 100%); 
            border-top: 2px solid #888; border-radius: 2px 2px 0 0;
            transition: transform 0.05s linear; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.9);
        }
        
        /* Lyspunkt (Tritium) */
        .front-dot { 
            position: absolute; top: 8px; left: 6px; width: 12px; height: 12px; 
            background: radial-gradient(circle, #fff 0%, #888 100%); border-radius: 50%; 
            transition: background 0.2s, box-shadow 0.2s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }
        .dot-aligned { background: radial-gradient(circle, #fff 0%, #00e676 100%) !important; box-shadow: 0 0 15px #00e676 !important; }

        #status { display: flex; flex-direction: column; text-align: left;}
        #main-title { font-size: 20px; margin: 0; color: #fff; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        #sub-status { font-size: 14px; color: #00e5ff; font-weight: 700; }
        
        /* Slider PBR */
        input[type=range] { -webkit-appearance: none; width: 60%; background: transparent; pointer-events: auto; opacity: 0.7; position: absolute; bottom: 30px; left: 20%; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 12px; background: #fff; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.8); cursor: pointer; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 2px; }
    </style>
</head>
<body>

    <video id="camera-stream" autoplay playsinline muted></video>

    <div id="sight-container" style="display: none;">
        <div class="front-sight" id="front-sight"><div class="front-dot" id="front-dot"></div></div>
        <div class="rear-sight"></div>
    </div>

    <div id="ui-layer">
        <div class="panel">
            <div id="status">
                <span id="main-title">AR SENSOR</span>
                <span id="sub-status">Väntar på aktivering</span>
            </div>
            <button id="startBtn">AKTIVERA</button>
            <button id="calBtn">KALIBRERA SIKTE</button>
        </div>
        <input type="range" id="threshold" min="0" max="255" value="150">
    </div>

    <script>
        const MY_ID = "min_unika_simulator_123"; 

        let client, audioContext, analyser, dataArray;
        let isReadyToShoot = true;
        let startAlpha = null, startBeta = null, startGamma = null;
        let currentX = 0, currentY = 0;
        let traceHistory = []; 
        let lastX = 0, lastY = 0;
        let sightOffsetX = 0, sightOffsetY = 0;

        const startBtn = document.getElementById('startBtn');
        const calBtn = document.getElementById('calBtn');
        const subStatusEl = document.getElementById('sub-status');
        const video = document.getElementById('camera-stream');
        const frontSight = document.getElementById('front-sight');
        const frontDot = document.getElementById('front-dot');

        async function initSystem() {
            startBtn.innerText = "...";
            subStatusEl.innerText = "Startar kamera...";
            try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch(e) {}

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: "environment" } });
                video.srcObject = stream;
                await video.play(); 

                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioCtx();
                if(audioContext.state === 'suspended') await audioContext.resume();
                
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm !== 'granted') throw new Error("Gyroskop nekat");
                }

                subStatusEl.innerText = "Kopplar nätverk...";

                client = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), "phone_" + Math.random().toString(16).substr(2, 8));
                client.connect({ useSSL: true, onSuccess: () => { 
                    subStatusEl.innerText = "Rikta mot krysset och kalibrera";
                    subStatusEl.style.color = "#00e676";
                    startBtn.style.display = "none"; calBtn.style.display = "block";
                    document.getElementById('sight-container').style.display = "block";
                    
                    window.addEventListener('deviceorientation', handleOrientation);
                    detectSound(); physicsLoop();
                }});
            } catch (error) { 
                startBtn.innerText = "FÖRSÖK IGEN";
                subStatusEl.innerText = "Fel: Tillåt kamera/mic"; subStatusEl.style.color = "red";
            }
        }

        calBtn.addEventListener('click', () => {
            startAlpha = null; traceHistory = [];
            subStatusEl.innerText = "Sensor Låst & Redo"; subStatusEl.style.color = "#fff";
        });

        function handleOrientation(event) {
            if (startAlpha === null) { startAlpha = event.alpha; startBeta = event.beta; startGamma = event.gamma; }
            let deltaX = event.gamma - startGamma;
            let deltaY = event.alpha - startAlpha;
            if (deltaY > 180) deltaY -= 360; if (deltaY < -180) deltaY += 360;
            currentX = deltaX; currentY = deltaY;
        }

        function physicsLoop() {
            traceHistory.push({ x: currentX, y: currentY });
            if (traceHistory.length > 30) traceHistory.shift();

            let targetOffsetX = -((currentX - lastX) * 10);
            let targetOffsetY = -((currentY - lastY) * 10);
            sightOffsetX += (targetOffsetX - sightOffsetX) * 0.2; sightOffsetY += (targetOffsetY - sightOffsetY) * 0.2;
            lastX = currentX; lastY = currentY;

            frontSight.style.transform = `translate(${sightOffsetX}px, ${sightOffsetY}px)`;
            
            if(Math.abs(sightOffsetX) < 6 && Math.abs(sightOffsetY) < 6) frontDot.classList.add('dot-aligned'); 
            else frontDot.classList.remove('dot-aligned');

            requestAnimationFrame(physicsLoop);
        }

        function detectSound() {
            analyser.getByteFrequencyData(dataArray);
            if (Math.max(...dataArray) > document.getElementById('threshold').value && isReadyToShoot) fireShot();
            requestAnimationFrame(detectSound);
        }

        function fireShot() {
            isReadyToShoot = false;
            const payload = JSON.stringify({ action: "BANG", x: currentX, y: currentY, trace: traceHistory });
            const message = new Paho.MQTT.Message(payload);
            message.destinationName = MY_ID; client.send(message);
            
            document.getElementById('ui-layer').style.background = "rgba(255,255,255,0.4)";
            setTimeout(() => { document.getElementById('ui-layer').style.background = "transparent"; isReadyToShoot = true; }, 80);
        }

        startBtn.addEventListener('click', initSystem);
    </script>
</body>
</html>
